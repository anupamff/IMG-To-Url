<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Not Found - GAMER LINK CONVERTER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #0f0f1a 50%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .not-found-container {
            text-align: center;
            padding: 40px;
        }
        .not-found-icon {
            font-size: 120px;
            color: #dc3545;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        h1 {
            font-size: 72px;
            color: #fff;
            margin-bottom: 20px;
        }
        p {
            color: #888;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .home-btn {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="not-found-container">
        <div class="not-found-icon">
            <i class="fas fa-image"></i>
            <i class="fas fa-ban" style="position: relative; left: -40px; top: -20px; font-size: 60px; color: #fff;"></i>
        </div>
        <h1>404</h1>
        <p><i class="fas fa-exclamation-triangle"></i> Image Not Found or Deactivated</p>
        <p>The image you're looking for has been deactivated or doesn't exist.</p>
        <button class="home-btn" onclick="window.location.href='/'">
            <i class="fas fa-home"></i> Back to Home
        </button>
    </div>
</body>
</html>
